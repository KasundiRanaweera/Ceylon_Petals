<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#fcf9f8" />
    <!-- Light or dark theme, decided before the page draws: the visitor's saved choice, else their device. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('cp-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141312')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Start downloading the home hero photo straight away, before the app's JavaScript runs. -->
    <link rel="preload" as="image" href="/images/home/bloom/stage-5.webp" imagesrcset="/images/home/bloom/stage-5-680.webp 680w, /images/home/bloom/stage-5.webp 1020w" imagesizes="(min-width: 1024px) 60vw, 90vw" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  rel="stylesheet"

</html>
