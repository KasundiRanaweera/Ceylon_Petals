# Keeps the API on Render's free plan awake. The free plan sleeps after 15 minutes without
# visitors, and the next visitor then waits for it to start. Calling the health check every
# 10 minutes prevents that. It can also be run by hand from the Actions tab.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the API health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://ceylon-petals-api.onrender.com/api/health
